name: Live API Tests

on:
  schedule:
    # Weekly Monday at 12:00 UTC
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# Guard against overlapping runs (e.g. a manual workflow_dispatch firing while
# the weekly schedule is still running) racing on the same per-server drift
# issue. Never cancel-in-progress here: this isn't a per-PR workflow (no
# "superseded" run to supersede), and cutting a live-test run off mid-flight
# would risk an inconsistent partial drift report.
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  live-test:
    runs-on: ubuntu-latest
    # NOTE: do NOT set continue-on-error here. A failing server must turn the
    # run red so the default failure notification fires — this job's whole
    # purpose is early warning of upstream NOAA endpoint drift. fail-fast is
    # off so one server's outage doesn't cancel the others.
    strategy:
      fail-fast: false
      matrix:
        server: [adcirc-mcp, coops-mcp, erddap-mcp, goes-mcp, ndbc-mcp, nhc-mcp, ofs-mcp, recon-mcp, rtofs-mcp, schism-mcp, stofs-mcp, usgs-mcp, winds-mcp, ww3-mcp]
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "servers/${{ matrix.server }}/uv.lock"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: servers/${{ matrix.server }}
        run: uv sync --group dev
        timeout-minutes: 5

      - name: Run live tests
        working-directory: servers/${{ matrix.server }}
        run: uv run pytest tests/test_live.py -v -s --tb=short
        timeout-minutes: 5

      # On failure, open (or comment on) a per-server drift issue so the
      # signal is actionable, not just a red X in the Actions tab.
      - name: Report drift on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Live API drift: ${{ matrix.server }}"
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          body="Weekly live-API tests failed for \`${{ matrix.server }}\` — most often an upstream NOAA endpoint moved (drift). Investigate and verify against the live source. Run: ${run_url}"
          num=$(gh issue list --repo "${{ github.repository }}" --state open --search "$title in:title" \
                --json number,title --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ -n "$num" ]; then
            gh issue comment "$num" --repo "${{ github.repository }}" --body "$body"
          else
            gh issue create --repo "${{ github.repository }}" --title "$title" --body "$body"
          fi
