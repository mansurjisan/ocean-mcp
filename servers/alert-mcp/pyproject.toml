[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alert-mcp"
version = "0.1.0"
description = "MCP server for CORAL threshold alerting — monitors NOAA CO-OPS stations and triggers alerts"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    {name = "Mansur Jisan", email = "mansur.jisan@gmail.com"},
]
keywords = [
    "mcp",
    "model-context-protocol",
    "noaa",
    "coops",
    "alerts",
    "threshold",
    "monitoring",
    "water-level",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = [
    "mcp[cli]>=1.0.0",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/mansurjisan/ocean-mcp"
Repository = "https://github.com/mansurjisan/ocean-mcp"

[project.scripts]
alert-mcp = "alert_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/alert_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]
