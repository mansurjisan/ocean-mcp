[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hpc-system-mcp"
version = "0.1.0"
description = "MCP server for NOAA RDHPCS HPC system management — quotas, allocations, modules, and storage"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    {name = "Mansur Jisan", email = "mansur.jisan@gmail.com"},
]
keywords = [
    "mcp",
    "model-context-protocol",
    "noaa",
    "hpc",
    "rdhpcs",
    "slurm",
    "quota",
    "modules",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = [
    "mcp[cli]>=1.0.0,<2",
    "pydantic>=2.0.0,<3",
]

[project.urls]
Homepage = "https://github.com/mansurjisan/ocean-mcp"
Repository = "https://github.com/mansurjisan/ocean-mcp"

[project.scripts]
hpc-system-mcp = "hpc_system_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hpc_system_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]
